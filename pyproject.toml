[project]
name = "whatsgoingon"
version = "0.1.0"
description = "Macro data pipeline, agent with tool use, and RAG-backed monthly narrative"
readme = "README.md"
authors = [
    { name = "Claudio Ricci", email = "100707767+cricci3@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.7.0",
]

[project.scripts]
whatsgoingon = "whatsgoingon.ingest:main"
whatsgoingon-agent = "whatsgoingon.agent.run:main"
whatsgoingon-api = "whatsgoingon.api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
